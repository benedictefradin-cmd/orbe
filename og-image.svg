<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="sun" cx="36%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#e9d9b0"/>
      <stop offset="58%" stop-color="#c0804a"/>
      <stop offset="100%" stop-color="#4f5d38"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="#f3eee3"/>

  <!-- orbital system -->
  <g transform="translate(600 360)" fill="none">
    <circle r="250" stroke="#15130d" stroke-opacity="0.12" stroke-width="2.5"/>
    <circle r="200" stroke="#5d6e44" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="8 10"/>
    <circle r="135" stroke="#15130d" stroke-opacity="0.12" stroke-width="2.5"/>
    <circle r="78" fill="url(#sun)"/>
    <circle cx="0" cy="-200" r="11" fill="#7da0c4"/>
    <circle cx="135" cy="0" r="11" fill="#c0804a"/>
    <circle cx="-103" cy="172" r="11" fill="#7d9457"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="600" y="790" font-size="150" fill="#15130d" letter-spacing="2" text-anchor="middle">ORBE</text>
  <text x="600" y="858" font-size="27" fill="#5b574c" font-family="monospace" letter-spacing="8" text-anchor="middle">STUDIO D'AUTOMATISATION IA</text>
  <text x="600" y="990" font-size="76" fill="#15130d" font-style="italic" text-anchor="middle">Le répétitif,</text>
  <text x="600" y="1078" font-size="76" fill="#4f5d38" font-style="italic" text-anchor="middle">en orbite.</text>
</svg>
